name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo check (deny warnings)
        run: cargo check --locked --all-targets --all-features
        env:
          RUSTFLAGS: -D warnings

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo test (deny warnings)
        run: cargo test --locked --all-targets --all-features
        env:
          RUSTFLAGS: -D warnings

  doctest:
    name: doctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo test docs (deny warnings)
        run: cargo test --locked --doc
        env:
          RUSTFLAGS: -D warnings

  mutants-diff:
      name: mutants (diff)
      runs-on: ubuntu-latest

      if: github.event_name == 'pull_request'

      steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 0  # required to diff against base branch

        - uses: dtolnay/rust-toolchain@stable
        - uses: Swatinem/rust-cache@v2
        - uses: taiki-e/install-action@cargo-mutants

        - name: compute diff
          run: |
            git fetch origin main
            git diff origin/main...HEAD > diff.patch

        - name: run cargo mutants (diff only)
          run: |
            cargo mutants \
              -j2 \
              --in-diff diff.patch \
              --cargo-arg=--locked
          env:
            RUSTFLAGS: -D warnings

        - uses: actions/upload-artifact@v7
          if: always()
          with:
            name: mutants-out
            path: mutants.out/

  tree-sitter-test:
    name: tree-sitter test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/tree-sitter-knitout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/tree-sitter-knitout/package-lock.json
      - run: npm ci
      - run: npx tree-sitter test

  tree-sitter-generate-check:
    name: tree-sitter generate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/tree-sitter-knitout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/tree-sitter-knitout/package-lock.json
      - run: npm ci
      - run: npx tree-sitter generate
      - name: fail if generate produced changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::'tree-sitter generate' produced changes. Run it locally and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  tree-sitter-version-consistency:
    name: knitout-tree-sitter version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/tree-sitter-knitout
    steps:
      - uses: actions/checkout@v7
      - name: compare versions
        run: |
          CARGO_VERSION=$(awk -F'"' '/^\[package\]/{f=1} f && /^version *=/{print $2; exit}' Cargo.toml)
          PKG_VERSION=$(jq -r .version package.json)
          echo "Cargo.toml:   $CARGO_VERSION"
          echo "package.json: $PKG_VERSION"
          if [ -z "$CARGO_VERSION" ] || [ -z "$PKG_VERSION" ]; then
            echo "::error::Could not read one or both versions"
            exit 1
          fi
          if [ "$CARGO_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: Cargo.toml=$CARGO_VERSION package.json=$PKG_VERSION"
            exit 1
          fi

  tree-sitter-examples-tests-check:
    name: tree-sitter examples sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-tree-sitter-examples.sh

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  machete:
    name: cargo machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --workspace --all-features

