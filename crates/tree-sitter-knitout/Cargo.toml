[package]
name = "tree-sitter-knitout"
description = "Knitout (.k) is a file format that can represent low-level knitting machine instructions in a machine-independent way."
version = "0.1.0"
authors = ["Nat Hurtig <nhurtig@acm.org>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "knitout"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/knitout-tools/knitout-tools"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.10"
