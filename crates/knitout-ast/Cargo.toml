[package]
name = "knitout-ast"
description = "Parametric AST for Knitout (.k), a machine knitting language."
version = "0.1.0"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["knitout"]

[dependencies]
either = { version = "1.16.0" }
bigdecimal = "0.4.10"
indexmap = { version = "2.14.0" }
serde = { version = "1.0", optional = true, features = ["derive"] }

[features]
serde = ["dep:serde", "either/serde", "indexmap/serde"]
