[package]
name = "knitout-ast"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/knitout-tools/knitout-tools"
authors = ["Nat Hurtig <nhurtig@acm.org>"]
readme = "README.md"
keywords = ["knitout"]

[dependencies]
either = { version = "1.16.0" }
bigdecimal = "0.4.10"
indexmap = { version = "2.14.0" }
serde = { version = "1.0", optional = true, features = ["derive"] }

[features]
serde = ["dep:serde", "either/serde", "indexmap/serde"]
