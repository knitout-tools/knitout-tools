[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]

[bans]
# `warn` rather than `deny`: tower-lsp (used by the knitout-lsp crate) transitively pulls in older
# duplicate versions of some crates (e.g. bitflags 1.3.2 via lsp-types, hashbrown 0.14.5 via
# dashmap) that cannot be deduplicated without upstream changes.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
